<div id="wrapper" *ngIf="loadedAllChats">
    <perfect-scrollbar>
        <div id="chat-messages-wrapper" #scrollMe>
            <ng-container *ngFor="let chat of chatArray">
                <app-chat-item [chat]="chat"></app-chat-item>
            </ng-container>
            <div *ngIf="isTyping && currentUserId !== typingChat.user._id">
                <app-chat-item [chat]="typingChat" [typing]="isTyping"></app-chat-item>
            </div>
        </div>
    </perfect-scrollbar>
    <div id="chat-form-wrapper">
        <form [formGroup]="chatForm">
            <textarea id="textarea"
                        formControlName="message"
                        placeholder="Enter message..." 
                        rows="2" 
                        (keypress)="typing()" 
                        (keyup.backspace)="stoppedTyping()"
                        (keyup.control.x)="stoppedTyping()" 
                        (keyup.control.a.control.x)="stoppedTyping()" 
                        (keydown.enter)="sendMessage();false">
            </textarea>
            <button (click)="sendMessage()">Send</button>
        </form>
    </div>
</div>
