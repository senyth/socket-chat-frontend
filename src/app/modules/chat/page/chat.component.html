<div id="wrapper" *ngIf="loadedAllChats">
    <perfect-scrollbar>
        <div id="chat-messages-wrapper" #scrollMe>
            <ng-container *ngFor="let chat of chatArray">
                <app-chat-item [chat]="chat"></app-chat-item>
            </ng-container>
        </div>
    </perfect-scrollbar>
    <div id="chat-form-wrapper">
        <form [formGroup]="chatForm">
            <textarea id="textarea" (keypress)="typing()" formControlName="message" placeholder="Enter message..." rows="2" (keydown.enter)="sendMessage();false" #searchInput></textarea>
            <button (click)="sendMessage()" *ngIf="chatForm.valid">Send</button>
        </form>
    </div>
</div>
