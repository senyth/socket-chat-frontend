<div id="wrapper" *ngIf="loadedAllChats">
    <!-- <div id="status"></div> -->
    <perfect-scrollbar style="max-width: auto; max-height: auto">
        <div id="chat-messages-wrapper" #scrollMe>
            <div class="message" *ngFor="let chat of chatArray" 
                    [class.sent]="chat.user_id === currentUserId"
                    [class.received]="chat.user_id !== currentUserId">
                <!-- <app-chat-item [chat]="chat"></app-chat-item> -->
                <div class="chat">
                    <p>{{chat.message}}</p>
                </div>
            </div>
        </div>
    </perfect-scrollbar>
    <div id="chat-form-wrapper">
        <form [formGroup]="chatForm">
            <textarea id="textarea" formControlName="message" class="form-control" placeholder="Enter message..." rows="2"></textarea>
            <button (click)="sendMessage()" [disabled]="!chatForm.valid">Send</button>
        </form>
    </div>
</div>
