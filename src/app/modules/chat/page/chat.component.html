<div class="container" *ngIf="loadedAllChats">
    <div class="row">
        <div class="col-md-6 offset-md-3 col-sm-12">
            <!-- <h1 class="text-center">
                MongoChat 
                <button id="clear" class="btn btn-danger">Clear</button>
            </h1> -->
            <div id="status"></div>
            <div id="chat">
                <div class="card">
                    <div id="messages" class="card-block" *ngFor="let chat of chatArray">
                        <app-chat-item [chat]="chat"></app-chat-item>
                    </div>
                </div>
                <br>
                <form [formGroup]="chatForm">
                    <textarea id="textarea" formControlName="message" class="form-control" placeholder="Enter message..."></textarea>
                    <button (click)="sendMessage()">Send</button>
                </form>
            </div>
        </div>
    </div>
</div>
